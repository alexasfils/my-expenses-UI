<div class="custom-modal-backdrop">
    <div class="custom-modal">
        <div class="custom-modal-header">
            <h5>Add Expense</h5>
            <button (click)="closeModal()" class="btn-close">×</button>
        </div>
        <div class="custom-modal-body">
            <form class="row g-3" [formGroup]="expenseForm" (ngSubmit)="addExpense()">
                <div>
                    <div class="form-group">
                        <label class="col-md-4">Name</label>
                            <input class="form-control" formControlName="name" placeholder="expense name">
                    </div>
                    <div class="form-group">
                        <label class="col-md-4" class="col-md-4">Category</label>
                        <select class="form-control" formControlName="categoryName" #categoryName >
                            <option *ngFor="let category of categories" [value]="category.name">
                                {{ category.name }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="col-md-4">Date</label>
                            <input class="form-control" type="date" formControlName="date" placeholder="Date">
                    </div>
                    <div class="form-group">
                        <label class="col-md-4">Amount</label>
                            <input class="form-control" type="number" formControlName="amount" placeholder="amount">
                    </div>
                    <div class="form-group">
                        <label class="col-md-4">Description</label>
                            <input class="form-control" type="text" formControlName="description"
                                placeholder="description">
                    </div>
                </div>

                <div class="col-auto">
                    <button class="btn btn-outline-success me-3" type="submit" [disabled]="!expenseForm.valid"><i
                            class="bi bi-floppy2-fill"></i></button>
                    <button type="button" class="btn btn-secondary" (click)="reset()"><i
                            class="bi bi-x-lg"></i></button>
                </div>
            </form>
        </div>
    </div>
</div>
